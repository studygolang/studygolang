name: CI

on:
  push:
    branches: [master, developer]
  pull_request:
    branches: [master, developer]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go · build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: gofmt
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "::error::以下文件需要运行 gofmt -s -w："
            printf '%s\n' "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        env:
          # CI 专用测试盐值，非生产密钥。internal/http 的 init() 在缺少 TOKEN_SALT
          # 时会 panic，使整个测试二进制无法启动（api 包测试因此全部失败）。
          TOKEN_SALT: ci-test-token-salt-0123456789abcdef0123456789abcdef
          JWT_SECRET: ci-test-jwt-secret-0123456789abcdef0123456789abcdef
        run: |
          go test -race -cover ./...
          go test -race -cover -tags unit ./...
          # -tags integration 需要真实 Redis/MySQL，不在本 job 运行

  frontend:
    name: Frontend · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
