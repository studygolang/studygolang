# StudyGolang 生产环境 Nginx 配置
# Go 后端 (8090) + Next.js 前端 (3000)

# ==================== 安全 Header ====================
server {
    listen 443 ssl http2;
    server_name studygolang.com www.studygolang.com;

    ssl_certificate     /etc/ssl/studygolang.crt;
    ssl_certificate_key /etc/ssl/studygolang.key;

    # HSTS: 强制 HTTPS（首次访问后浏览器记住 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP: 限制资源加载来源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.golangjob.cn https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://static.golangjob.cn; img-src 'self' data: https:; font-src 'self' https://static.golangjob.cn; connect-src 'self' wss: https:; frame-ancestors 'none';" always;

    # 防止点击劫持
    add_header X-Frame-Options "DENY" always;

    # 防止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # XSS 保护（旧浏览器）
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== Go 后端路由 ====================

    # API 接口
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket 空闲超时 1 小时
        proxy_send_timeout 3600s;
    }

    # 管理后台（保持 Go 模板渲染）
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth 回调
    location /oauth/callback/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 微信自动回复回调（URL 固定，不可改路径）
    location /wechat/autoreply {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 微信绑定
    location /wechat/bind {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # URL 包装跳转（302 重定向，不可放 /api/v1 前缀）
    location = /wr {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # RSS Feed
    location = /feed {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源（用户上传等）
    location /static/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap & Robots
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # ==================== Next.js 前端（默认路由） ====================

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name studygolang.com www.studygolang.com;
    return 301 https://$host$request_uri;
}
