# StudyGolang 生产环境 Nginx 配置（支持新旧版本灰度切流）
# Go 后端 (8090) + Next.js 前端 (3000)
#
# 灰度路由逻辑：
#   1. Cookie sg_version=new  →  Next.js（用户主动选择新版）
#   2. Cookie sg_version=old  →  Go 模板（用户主动选择旧版）
#   3. 无 Cookie              →  按 split_clients 比例自动分配
#
# 调整灰度比例：修改下方 split_clients 块的百分比，然后 nginx -s reload
# 一键回滚：将 split_clients 的百分比改为 0%，reload 后所有新访客回到旧版
#
# 注意：upstream / split_clients / map 必须位于 http {} 上下文。
#       若通过 conf.d/*.conf 引入则自动满足（典型 nginx.conf 会 include conf.d）。

# ==================== 后端上游 ====================
upstream go_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

upstream nextjs_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ==================== 灰度比例（无 Cookie 用户的默认分配） ====================
# 以 客户端IP + UA 作为哈希键，保证同一用户始终落到同一后端
# 调整百分比后执行 nginx -s reload 生效
# 阶段建议：5% → 20% → 50% → 100%
split_clients "${remote_addr}${http_user_agent}" $sg_grayscale_pick {
    5%      nextjs;
    *       go;
}

# ==================== 路由决策 ====================
# 优先级：用户显式 Cookie > 灰度自动分配
map $cookie_sg_version $sg_target {
    default     $sg_grayscale_pick;   # 无 Cookie：走灰度结果
    "new"       nextjs;                # 用户选择新版
    "old"       go;                    # 用户选择旧版
    ""          $sg_grayscale_pick;   # Cookie 为空：走灰度结果
}

# 将逻辑名映射到实际 upstream
map $sg_target $sg_upstream {
    default     http://go_backend;
    "nextjs"    http://nextjs_backend;
    "go"        http://go_backend;
}

# ==================== HTTPS Server ====================
server {
    listen 443 ssl http2;
    server_name studygolang.com www.studygolang.com;

    ssl_certificate     /etc/ssl/studygolang.crt;
    ssl_certificate_key /etc/ssl/studygolang.key;

    # HSTS: 强制 HTTPS（首次访问后浏览器记住 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP: 限制资源加载来源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.golangjob.cn https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://static.golangjob.cn; img-src 'self' data: https:; font-src 'self' https://static.golangjob.cn; connect-src 'self' wss: https:; frame-ancestors 'none';" always;

    # 防止点击劫持
    add_header X-Frame-Options "DENY" always;

    # 防止 MIME 嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # XSS 保护（旧浏览器）
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== 始终走 Go 后端的路由 ====================

    # API 接口（新旧前端共用，始终 Go 后端）
    location /api/v1/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧版 App API（手机端）
    location /app/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /ws {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket 空闲超时 1 小时
        proxy_send_timeout 3600s;
    }

    # 管理后台（保持 Go 模板渲染，不参与灰度）
    location /admin {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OAuth 回调
    location /oauth/callback/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 微信自动回复回调（URL 固定，不可改路径）
    location /wechat/autoreply {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 微信绑定
    location /wechat/bind {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # URL 包装跳转（302 重定向，不可放 /api/v1 前缀）
    location = /wr {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # RSS Feed
    location = /feed {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源（用户上传等）
    location /static/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sitemap & Robots（始终 Go 后端，保证 SEO 一致）
    location = /sitemap.xml {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
    }
    location = /robots.txt {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
    }

    # ==================== 页面路由（按灰度决策） ====================
    location / {
        proxy_pass $sg_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 标记本次请求命中的后端，便于日志追踪与排障
        add_header X-SG-Backend $sg_target always;
    }
}

# ==================== HTTP -> HTTPS 重定向 ====================
server {
    listen 80;
    server_name studygolang.com www.studygolang.com;
    return 301 https://$host$request_uri;
}
