# StudyGolang 灰度切流配置示例
# 基于 Nginx split_clients 按比例分流
# 使用方式: 替换 nginx.conf 中的 server 块（或 include 此文件覆盖）

# 定义分流变量：90% → 旧系统（Go 模板），10% → 新系统（Next.js）
split_clients "${remote_addr}" $nextjs_backend {
    10%    nextjs;
    *      go_backend;
}

upstream go_backend {
    server 127.0.0.1:8090;
}

upstream nextjs_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name studygolang.com;

    # 一键回滚开关：将 $use_nextjs 设为空字符串即可全部切回 Go 后端
    set $use_nextjs $nextjs_backend;

    # API 请求始终走 Go 后端
    location /api/v1/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端页面按比例分流
    location / {
        proxy_pass http://$use_nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 添加标记 header，方便追踪请求来源
        add_header X-Backend $use_nextjs always;
    }
}

# 灰度步骤:
# 1. 10% 流量到 Next.js，观察 24 小时
# 2. 逐步提升到 30% → 50% → 80% → 100%
# 3. 每阶段观察关键指标
#
# 监控指标:
# - HTTP 5xx 错误率（Nginx access.log）
# - 页面平均响应时间（p50/p95/p99）
# - API 成功率（/api/v1/* 状态码统计）
# - 用户活跃度指标（登录/发布/评论数量是否异常）
# - 搜索引擎收录量变化
#
# 一键回滚:
#   sed -i 's/set \$use_nextjs \$nextjs_backend;/set \$use_nextjs "";/' /etc/nginx/conf.d/studygolang.conf
#   nginx -s reload
